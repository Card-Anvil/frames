name: Release frame-kit

# Step one of two. Pick how big a jump this is and press Run: this works out
# the version, checks the frames still pack, and opens a pull request with the
# bump. Merging that pull request publishes — see publish-frame-kit.yml.
#
# It opens a pull request rather than pushing to the default branch because
# `trunk` is protected and locked, which is a deliberate property of this
# repository and not something a release should be allowed to talk its way
# around. The cost is one extra click; the benefit is that a release goes
# through the same CI and review as everything else.
#
# Frames themselves are not published to npm — they are far too large, and are
# distributed as source (this repo) or as .cardframe bundles on a release. Only
# the contract ships as a package.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How much to raise the version"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: "Optional note to put at the top of the pull request"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-frame-kit
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the release app is configured
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$CLIENT_ID" ] && missing="${missing}the RELEASE_APP_CLIENT_ID variable "
          [ -z "$PRIVATE_KEY" ] && missing="${missing}the RELEASE_APP_PRIVATE_KEY secret "
          if [ -n "$missing" ]; then
            echo "::error::Missing ${missing}— see 'Releasing frame-kit' in AGENTS.md. The client id is a variable, not a secret." >&2
            exit 1
          fi

      # An identity of its own, rather than the default GITHUB_TOKEN: a pull
      # request opened with that token does not start other workflows, so `ci`
      # would never run on it and a protected branch would never let it merge.
      #
      # A GitHub App rather than a personal token because nothing about it
      # expires, it belongs to the organisation rather than to a person, and
      # installing it is the grant — no resource-owner trap and no approval
      # queue. The token minted here lives about an hour and reaches only this
      # repository.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrower than the app may hold, so this workflow states what it
          # actually needs and stays least-privilege if the app ever gains more.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # From the package, not from tags: the package's version is what npm
          # already has, and this repo published 0.2.0 before it tagged
          # anything. Deriving from tags would compute a version below what is
          # already on the registry.
          BASE="$(node -p "require('./packages/frame-kit/package.json').version")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump '$BUMP'" >&2; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if git rev-parse "frame-kit-v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag frame-kit-v${VERSION} already exists." >&2
            exit 1
          fi
          # Catch a duplicate now, rather than after a pull request has been
          # reviewed and merged.
          published="$(npm view "@cardanvil/frame-kit@${VERSION}" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::@cardanvil/frame-kit@${VERSION} is already on npm." >&2
            exit 1
          fi

          BRANCH="release/frame-kit-v${VERSION}"
          # A release already proposed is not a release to propose again.
          # Rewriting a pull request someone may be reading is worse than
          # stopping and saying so.
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "::error::#${open_pr} already proposes ${VERSION}. Merge or close it first." >&2
            exit 1
          fi

          echo "Current version: $BASE. This release: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Nothing is proposed unless the frames the contract describes still pack.
      # CI runs these again on the pull request; running them here means a
      # broken release never becomes a pull request at all.
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run frames:validate

      - name: Record the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd packages/frame-kit
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          # Through the environment, never into the script body: a workflow
          # input pasted straight into `run:` is a command-injection hole.
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # Attribute the commit to the release app rather than to
          # github-actions[bot], so it is obvious what made it. The numeric id
          # is what links the address to the bot account.
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/frame-kit/package.json
          git commit -m "chore(frame-kit): release $VERSION"
          # Forced because a run that failed after pushing leaves the branch
          # behind, and re-running is the obvious next thing to do — an
          # ordinary push is then refused as a non-fast-forward, which says
          # nothing about what is actually wrong. Safe: the branch is this
          # workflow's own, named after the exact version, and the check above
          # already refused to touch one with an open pull request.
          if ! git push --force origin "$BRANCH"; then
            echo "::error::Could not push $BRANCH. Check the release app is installed on this repository with Contents: write." >&2
            exit 1
          fi

          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            printf 'Raises `@cardanvil/frame-kit` to **%s**.\n\n' "$VERSION"
            printf 'Merging this publishes it: the push to `trunk` starts *Publish frame-kit*,\n'
            printf 'which tags `frame-kit-v%s`, cuts the GitHub release, and publishes to npm.\n\n' "$VERSION"
            printf 'Typecheck, tests, build and `frames:validate` all passed before this was\n'
            printf 'opened; CI runs them again here.\n'
          } > "$RUNNER_TEMP/pr-body.md"

          if ! gh pr create \
            --base trunk \
            --head "$BRANCH" \
            --title "chore(frame-kit): release $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::Pushed $BRANCH but could not open the pull request. 'Resource not accessible' means the release app is missing Pull requests: write." >&2
            exit 1
          fi
